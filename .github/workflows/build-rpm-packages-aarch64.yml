name: build-rpm-packages-signed-aarch64

on:
  push:
    branches: [ master ]

permissions:
  contents: write

# Several merges landing seconds apart used to start a run each, and every
# one of them published. Keep one build per branch and cancel the ones that
# a newer push has already superseded.
concurrency:
  group: rpm-aarch64-${{ github.ref }}
  cancel-in-progress: true


env:
  GPG_KEY_ID: ${{ secrets.ZMREPO_GPG_KEY_ID }}
  GPG_PASSPHRASE: ${{ secrets.ZMREPO_GPG_PASSPHRASE }}
  GPG_PRIVATE_KEY_B64: ${{ secrets.ZMREPO_GPG_PRIVATE_KEY_B64 }}
  TZ: America/New_York
  SMPFLAGS: -j10

jobs:
  build-rpm:
    name: Build & sign RPM (${{ matrix.distro }})
    if: github.repository == 'ZoneMinder/zoneminder'
    # Pin the arch: x64 self-hosted runners (fw2) also serve this repo.
    runs-on: [self-hosted, Linux, ARM64]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Rocky stopped publishing the official rockylinux image after 9.
          - distro: "rockylinux/rockylinux:10"
            releasever: "10"
            family: "el"
          - distro: "rockylinux:9"
            releasever: "9"
            family: "el"
          - distro: "rockylinux:8"
            releasever: "8"
            family: "el"
          - distro: "fedora:45"
            releasever: "45"
            family: "fedora"
          - distro: "fedora:44"
            releasever: "44"
            family: "fedora"
          - distro: "fedora:43"
            releasever: "43"
            family: "fedora"
    container:
      image: ${{ matrix.distro }}

    steps:
      - name: Enable EPEL and RPMFusion (EL)
        if: matrix.family == 'el'
        run: |
          set -eux
          dnf -y install dnf-plugins-core epel-release
          dnf -y install "https://mirrors.rpmfusion.org/free/el/rpmfusion-free-release-${{ matrix.releasever }}.noarch.rpm"
          if [ "${{ matrix.releasever }}" == "8" ]; then
            dnf config-manager --set-enabled powertools
          else
            dnf config-manager --set-enabled crb
          fi

      - name: Enable RPMFusion (Fedora)
        if: matrix.family == 'fedora'
        run: |
          set -eux
          dnf -y install dnf-plugins-core
          dnf -y install "https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-${{ matrix.releasever }}.noarch.rpm" || \
            dnf -y install "https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-rawhide.noarch.rpm"

      - name: Install build tools
        run: |
          set -eux
          # Install systemd to resolve conflicts with systemd-standalone-tmpfiles
          # in container images (needed by net-tools, mosquitto, etc.)
          dnf -y install --allowerasing systemd
          dnf -y install \
            git \
            rpm-build \
            rpmdevtools \
            rpmlint \
            gnupg2 \
            iproute \
            wget \
            rsync \
            openssh-clients \
            ca-certificates \
            createrepo_c

      - name: Setup RPM build directory
        run: |
          set -eux
          rm -rf ~/rpmbuild
          rpmdev-setuptree

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Mark git directory as safe
        run: |
          git config --global --add safe.directory /__w/zoneminder/zoneminder

      # The runner-provided $HOME (/github/home) persists between jobs on
      # self-hosted runners, so stale gpg lock files left by an earlier job can
      # stall the import when their recorded PID is reused in the new container.
      - name: Use a per-job GnuPG home
        run: |
          GNUPGHOME=$(mktemp -d)
          echo "GNUPGHOME=${GNUPGHOME}" >> "$GITHUB_ENV"

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7
        with:
          gpg_private_key: ${{ secrets.ZMREPO_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.ZMREPO_GPG_PASSPHRASE }}
          git_user_signingkey: false
          git_commit_gpgsign: false

      - name: Configure RPM signing
        run: |
          set -eux
          cat > ~/.rpmmacros << EOF
          %_signature gpg
          %_gpg_name ${GPG_KEY_ID}
          %__gpg /usr/bin/gpg2
          %__gpg_sign_cmd %{__gpg} gpg --batch --verbose --no-armor --no-secmem-warning -u "%{_gpg_name}" -sbo %{__signature_filename} --digest-algo sha256 %{__plaintext_filename}'
          EOF

      - name: Install build dependencies
        run: |
          set -eux
          dnf -y builddep --allowerasing distros/redhat/zoneminder.spec

      - name: Determine version and prepare sources
        id: version
        run: |
          set -eux
          VERSION=$(cat version.txt)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

          # Calculate snapshot version
          versionhash=$(git log -n1 --pretty=format:%h version.txt)
          numcommits=$(git rev-list ${versionhash}..HEAD --count)
          # date+numcommits is not unique per build: rebuilding the same commit
          # on the same day reuses the version, and the repo then holds one
          # version whose content changed underneath it. GITHUB_RUN_ID is unique
          # and never reused.
          SNAPSHOT="$(date +%Y%m%d).${numcommits}.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT:-1}"
          echo "snapshot=${SNAPSHOT}" >> $GITHUB_OUTPUT

          # Update version in spec file
          sed -i "s/^Version:.*/Version: ${VERSION}/" distros/redhat/zoneminder.spec
          sed -i "s/^Release:.*/Release: 0.${SNAPSHOT}%{?dist}/" distros/redhat/zoneminder.spec

          # Copy spec file to SPECS
          cp distros/redhat/zoneminder.spec ~/rpmbuild/SPECS/

      - name: Download submodule sources
        run: |
          set -eux
          VERSION=${{ steps.version.outputs.version }}

          # Read submodule versions from spec file
          CRUD_VERSION=$(grep '%global crud_version' distros/redhat/zoneminder.spec | awk '{print $3}')
          CEB_VERSION=$(grep '%global ceb_version' distros/redhat/zoneminder.spec | awk '{print $3}')
          RTSP_COMMIT=$(grep '%global rtspserver_commit' distros/redhat/zoneminder.spec | awk '{print $3}')
          CXXURL_VERSION=$(grep '%global CxxUrl_version' distros/redhat/zoneminder.spec | awk '{print $3}')

          # Download main ZoneMinder source tarball
          git archive --format=tar.gz --prefix=zoneminder-${VERSION}/ HEAD > ~/rpmbuild/SOURCES/zoneminder-${VERSION}.tar.gz

          # Download Crud
          curl -L -o ~/rpmbuild/SOURCES/crud-${CRUD_VERSION}.tar.gz \
            "https://github.com/FriendsOfCake/crud/archive/v${CRUD_VERSION}.tar.gz"

          # Download CakePHP-Enum-Behavior
          curl -L -o ~/rpmbuild/SOURCES/cakephp-enum-behavior-${CEB_VERSION}.tar.gz \
            "https://github.com/ZoneMinder/CakePHP-Enum-Behavior/archive/${CEB_VERSION}.tar.gz"

          # Download RtspServer
          curl -L -o ~/rpmbuild/SOURCES/RtspServer-${RTSP_COMMIT}.tar.gz \
            "https://github.com/ZoneMinder/RtspServer/archive/${RTSP_COMMIT}.tar.gz"

          # Download CxxUrl
          curl -L -o ~/rpmbuild/SOURCES/CxxUrl-${CXXURL_VERSION}.tar.gz \
            "https://github.com/chmike/CxxUrl/archive/${CXXURL_VERSION}.tar.gz"

          # List sources
          ls -la ~/rpmbuild/SOURCES/

      - name: Build SRPM
        run: |
          set -eux
          rpmbuild -bs ~/rpmbuild/SPECS/zoneminder.spec
          ls -la ~/rpmbuild/SRPMS/

      - name: Build RPMs
        run: |
          set -eux
          rpmbuild --rebuild ~/rpmbuild/SRPMS/zoneminder-*.src.rpm
          ls -la ~/rpmbuild/RPMS/

      - name: Sign RPMs
        run: |
          set -eux
          # Sign all RPM packages
          echo "${GPG_PASSPHRASE}" | gpg2 --batch --yes --passphrase-fd 0 \
            --pinentry-mode loopback -ab ~/rpmbuild/SRPMS/*.src.rpm || true

          for rpm in ~/rpmbuild/RPMS/*/*.rpm; do
            echo "${GPG_PASSPHRASE}" | rpm --addsign "$rpm" || echo "Warning: Failed to sign $rpm"
          done

          # Verify signatures
          rpm -K ~/rpmbuild/RPMS/*/*.rpm || true

      - name: Collect RPM artifacts
        run: |
          set -eux
          mkdir -p artifacts/rpm
          cp ~/rpmbuild/SRPMS/*.src.rpm artifacts/rpm/ || true
          cp ~/rpmbuild/RPMS/*/*.rpm artifacts/rpm/ || true
          ls -la artifacts/rpm/

      - name: Sanitize artifact name
        id: prep_artifact_name
        run: |
          sanitized_distro_name=$(echo -n "${{ matrix.distro }}" | sed -e 's/[;\\\/:<>"|*?]/_/g' -e 's/__*/_/g')
          echo "artifact_name=rpm-aarch64-${sanitized_distro_name}" >> $GITHUB_ENV

      - name: Upload RPM artifacts
        # Only the tag-only `release` job consumes these. On branch pushes the
        # packages go straight to ZMREPO below, so uploading is pure storage cost.
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: artifacts/rpm
          name: ${{ env.artifact_name }}
          retention-days: 1

      - name: Ensure ZMREPO target directory exists
        run: |
          set -eux
          mkdir -p ~/.ssh
          echo "${{ secrets.ZMREPO_SSH_KEY }}" > ~/.ssh/zmrepo_deploy_key
          chmod 600 ~/.ssh/zmrepo_deploy_key
          ssh -i ~/.ssh/zmrepo_deploy_key -o StrictHostKeyChecking=no \
            "${{ secrets.ZMREPO_SSH_USER }}@${{ secrets.ZMREPO_HOST }}" \
            "mkdir -p rpm/master/${{ matrix.family }}/${{ matrix.releasever }}/aarch64/"

      - name: Publish to ZMREPO
        uses: easingthemes/ssh-deploy@2cc5b27bf3029d0455dd5e09fe02633904031447 # v6.0.3
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ZMREPO_SSH_KEY }}
          ARGS: "-rltgoDzvO"
          SOURCE: artifacts/rpm/
          REMOTE_HOST: ${{ secrets.ZMREPO_HOST }}
          REMOTE_USER: ${{ secrets.ZMREPO_SSH_USER }}
          TARGET: rpm/master/${{ matrix.family }}/${{ matrix.releasever }}/aarch64/

      - name: Update ZMREPO metadata
        # rsync only copies the packages; dnf can't see them until the repo
        # metadata is rebuilt. The script survives this job being cancelled
        # and clears what an interrupted earlier run left behind.
        env:
          ZMREPO_DEST: ${{ secrets.ZMREPO_SSH_USER }}@${{ secrets.ZMREPO_HOST }}
          ZMREPO_DIR: rpm/master/${{ matrix.family }}/${{ matrix.releasever }}/aarch64/
        run: |
          set -eux
          ssh -i ~/.ssh/zmrepo_deploy_key -o StrictHostKeyChecking=no \
            "$ZMREPO_DEST" "bash -s -- $ZMREPO_DIR" < utils/zmrepo_createrepo.sh

  release:
    name: Create GitHub Release (on tag)
    needs: build-rpm
    if: github.repository == 'ZoneMinder/zoneminder' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: dist/**/*
