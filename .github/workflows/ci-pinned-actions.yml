name: CI Pinned Actions

on:
  push:
    branches:
      - '*'
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  pinned-actions:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check that every workflow action is pinned to a commit SHA
        run: python3 utils/check-pinned-actions.py
